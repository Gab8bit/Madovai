<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Madovai</title>
  <meta name="description" content="Bus, tram, metro e treni di Roma e del Lazio in tempo reale: Cotral, Atac e Roma TPL.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Madovai">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <!-- Shown by plain HTML+CSS until the JS app has mounted, so a slow connection never sees a blank page. -->
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/icon-192.png" width="84" height="84" alt="">
    <div class="spinner"></div>
    <div id="boot-msg" class="t-foot sec">Caricamento…</div>
  </div>
  <script>
    setTimeout(function () {
      var b = document.getElementById('boot'), m = document.getElementById('boot-msg');
      if (b && m) m.innerHTML = 'Il caricamento sta richiedendo più del previsto.<br><a href="" style="color:var(--tint)">Riprova</a>';
    }, 12000);
  </script>
  <noscript>Madovai richiede JavaScript.</noscript>
  <script src="vendor/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
